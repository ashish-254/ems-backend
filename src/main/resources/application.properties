#database configuration (MySQL)

# where employee_management_system is a database name.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management_system?useSSL=false&allowPublicKeyRetrieval=true
#setting up username
spring.datasource.username=root
#setting up password
spring.datasource.password=ashish
#given access for the database. it updates the schema only if necessary.
spring.jpa.hibernate.ddl-auto=update
#The dialect specifies the type of database used in hibernate so that hibernate generate appropriate type of SQL statements.
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect



#Logger configuration

#setting up lavel to trace for the controller package.
logging.level.com.employeemanagement.backend.controller= = TRACE
